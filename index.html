<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セキュリティ確認</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
    background: #f3f5f8; color: #202938;
  }
  .card {
    width: min(100%, 420px); background: white; padding: 28px;
    border-radius: 16px; box-shadow: 0 12px 35px #17203318;
  }
  .mark { font-size: 30px; text-align: center; }
  h1 { font-size: 1.4rem; text-align: center; margin: 10px 0; }
  .desc { line-height: 1.7; color: #4b5563; }
  label { display: block; margin: 16px 0 6px; font-weight: 650; }
  input {
    width: 100%; padding: 12px; border: 1px solid #cbd2dc; border-radius: 8px;
    font: inherit;
  }
  button {
    width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px;
    background: #2459d3; color: white; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .note { margin-top: 14px; font-size: .78rem; color: #687386; line-height: 1.5; }
  #reveal { display: none; text-align: center; }
  #reveal img { width: 100%; height: auto; border: 1px solid #ddd; }
  #reveal h2 { font-size: 1.4rem; }
</style>
</head>
<body>
<main class="card">
  <section id="login">
    <div class="mark" aria-hidden="true">🔐</div>
    <h1>不正ログインの確認</h1>
    <p class="desc">お使いのアカウントで通常と異なるログインが検知されました。セキュリティ確認を続けてください。</p>
    <form id="demoForm">
      <label for="email">メールアドレス（好きなものでも書いてください）</label>
      <input id="email" name="email" type="email" placeholder="test@example.com" autocomplete="off">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" placeholder="例：demo1234" autocomplete="off">
      <button type="submit">確認する</button>
    </form>
    <p class="note">部誌用のセキュリティ啓発デモですが入力内容が送信・保存できるようになっていませんが、実際のパスワードは入力しないでください。</p>
  </section>
